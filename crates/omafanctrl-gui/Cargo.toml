[package]
name = "omafanctrl-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GTK4 + libadwaita desktop app for omafanctrl"

[[bin]]
name = "omafanctrl-gui"
path = "src/main.rs"

[dependencies]
omafanctrl-core.workspace = true
# Renamed to the conventional `gtk`/`adw` paths used by gtk4-rs.
gtk = { package = "gtk4", version = "0.9" }
adw = { package = "libadwaita", version = "0.7", features = ["v1_7"] }
zbus.workspace = true
tokio.workspace = true
async-channel.workspace = true
futures-util.workspace = true
