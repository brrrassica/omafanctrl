name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job runs on every push (branches and tags) and on pull requests; no
  # job is gated behind a ref condition.
  #
  # The jobs run on the repo's self-hosted runners (Debian 13, rootless Docker)
  # inside an Arch Linux container because the GUI requires libadwaita >= 1.7,
  # which the Debian 13 host does not provide. Arch is also the target platform
  # (Omarchy Quattro).
  check:
    name: Format, lint, test, build
    runs-on: [self-hosted, Linux, X64, opencode-sam, debian-13, omafanctrl]
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf gtk4 libadwaita dbus

      - name: Checkout
        uses: actions/checkout@v4

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --all

  # Packaging runs on every push, so the release bundle is always built.
  package:
    name: Build binaries and package
    runs-on: [self-hosted, Linux, X64, opencode-sam, debian-13, omafanctrl]
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust pkgconf gtk4 libadwaita dbus zip

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binaries
        run: cargo build --release --locked --workspace

      - name: Read version
        id: version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Packaging omafanctrl $version"

      - name: Assemble the release bundle
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          stage="build/omafanctrl-$version"
          rm -rf build
          mkdir -p "$stage/bin"

          # Binaries.
          install -Dm755 target/release/omafanctrld      "$stage/bin/omafanctrld"
          install -Dm755 target/release/omafanctrl        "$stage/bin/omafanctrl"
          install -Dm755 target/release/omafanctrl-status "$stage/bin/omafanctrl-status"
          install -Dm755 target/release/omafanctrl-gui    "$stage/bin/omafanctrl-gui"
          install -Dm755 target/release/omafanctrl-probe  "$stage/bin/omafanctrl-probe"

          # Lifecycle scripts and payload.
          install -Dm755 scripts/install.sh     "$stage/scripts/install.sh"
          install -Dm755 scripts/uninstall.sh   "$stage/scripts/uninstall.sh"
          install -Dm755 scripts/restart-all.sh "$stage/scripts/restart-all.sh"
          install -Dm755 scripts/doctor.sh      "$stage/scripts/doctor.sh"
          cp -a data "$stage/data"
          cp -a docs "$stage/docs"
          install -Dm644 README.md   "$stage/README.md"
          install -Dm644 CHANGELOG.md "$stage/CHANGELOG.md"
          install -Dm644 LICENSE     "$stage/LICENSE"

          # Zip the bundle (scripts/ + prebuilt binaries + data).
          ( cd build && zip -r -q "../omafanctrl.zip" "omafanctrl-$version" )

      - name: Upload omafanctrl.zip
        uses: actions/upload-artifact@v4
        with:
          name: omafanctrl.zip
          path: omafanctrl.zip
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: [self-hosted, Linux, X64, opencode-sam, debian-13, omafanctrl]
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download omafanctrl.zip
        uses: actions/download-artifact@v4
        with:
          name: omafanctrl.zip

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: omafanctrl.zip
          generate_release_notes: true
