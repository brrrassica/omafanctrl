<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  D-Bus system bus policy for omafanctrl.

  Install to /usr/share/dbus-1/system.d/org.omarchy.omafanctrl.conf.

  The daemon (running as root) owns the name. Any user may call the read-only
  methods and receive signals; the mutating methods are additionally gated by
  the polkit action `org.omarchy.omafanctrl.control` (see
  data/polkit/org.omarchy.omafanctrl.policy).
-->
<busconfig>
  <!-- Only root may own the name. -->
  <policy user="root">
    <allow own="org.omarchy.omafanctrl"/>
    <allow send_destination="org.omarchy.omafanctrl"/>
    <allow receive_sender="org.omarchy.omafanctrl"/>
  </policy>

  <!-- Everyone may talk to the daemon; polkit gates the mutating methods. -->
  <policy context="default">
    <allow send_destination="org.omarchy.omafanctrl"/>
    <allow receive_sender="org.omarchy.omafanctrl"/>
  </policy>
</busconfig>