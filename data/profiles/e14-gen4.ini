// ================================================
// omafanctrl device profile — ThinkPad E14 Gen 4
// ================================================
//
// This profile is TPFanCtrl2-compatible. The EC register map below was verified
// against the TPFanCtrl2 2.3.3 source (fancontrol/fanstuff.cpp) and a live probe
// on the E14 Gen 4:
//
//     sudo cargo run -p omafanctrl-core --bin omafanctrl-probe
//
// See plans/risks.md (R1) and milestone M1.
//
// EC register map (verified):
//   0x2F       fan control   0x80 = BIOS controlled (safe state),
//                            0x00 = off, 0x01-0x07 = manual levels,
//                            0x40 = disengaged/advanced (unverified)
//   0x31       fan switch    0x00 = fan 1, 0x01 = fan 2
//                            (must be toggled before writing 0x2F)
//   0x84/0x85  fan RPM low/high byte   (RPM = (hi << 8) | lo)
//   0x78-0x7F  temperature sensors (8, primary bank)
//   0xC0-0xC3  temperature sensors (4, secondary bank)
//
// Sensor name -> offset (from the TPFanCtrl2 sensor table):
//   cpu = 0x78, gpu = 0x79, no5 = 0x7D, pwr = 0xC0, aps = 0xC1,
//   bus = 0xC2, pci = 0xC3
//
// TPFanCtrl2 ignores any sensor reading 0x00 or 0x80.
//
// Observed fan levels on the E14 Gen 4 (live probe, M1):
//   level 2 = 2200 RPM
//   level 3 = 3900 RPM (maximum)
// Levels 4-7 are "advanced" raw values and behave non-linearly; prefer 2-3.

Hotkeys=1
Active=2
ManFanSpeed=0
ManModeExit=78
StayOnTop=1
SlimDialog=0
BluetoothEDR=0
ProcessPriority=2
NoBallons=1
Cycle=5
NoExtSensor=0
StartMinimized=1
IconCycle=1
ShowTempIcon=1
IconLevels=65 75 80
FanBeep=0 0
MaxReadErrors=10
Log2File=0
Log2csv=0

// Disable the "pwr" sensor (sequence 11)
IgnoreSensors=pwr,no5,x7d,aps,bus,pci,xc3

// Sensor names (optional, for clarity)
SensorName5=no5

ShowBiasedTemps=1
ShowAll=0
IconColorFan=1
Lev64Norm=1

// ================================================
// Smart Mode 1 - Main Profile
// ================================================
MenuLabelSM1=Smart Mode 1/

// Level=temp  fan  hystUp  hystDown
Level=50  2  0  0
Level=60  3  0  0